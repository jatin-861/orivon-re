<style>
:root{
  --bg:#FAF7F2; --fg:#1A1A1A; --card:#FFFFFF; --border:#E5DDD3;

  --lavender:#6A5B7B; --ochre:#B87830; --chart1:#1A1A1A; --chart2:#C75B3A;
  --chart3:#8B5E3C; --chart5:#6B6358;
  --serif:"Bodoni Moda",Georgia,serif; --sans:"Cabinet Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
@page{ size:A4 landscape; margin:0; }
body{ font-family:var(--sans); background:var(--bg); color:var(--fg); font-size:11px; line-height:1.45; }
.page{ width:297mm; min-height:210mm; padding:12mm 14mm; position:relative; break-after:page; background:var(--bg); }
.page:last-child{ break-after:auto; }
h1,h2,h3{ font-family:var(--sans); font-weight:800; letter-spacing:-0.02em; }
.serif{ font-family:var(--serif); font-weight:400; }
.mono{ font-family:var(--mono); }
.accent{ color:var(--pink); }
.muted{ color:var(--muted-fg); }
.eyebrow{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--pink); display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.eyebrow::before{ content:""; width:18px; height:1.5px; background:var(--pink); display:inline-block;}
.rule{ height:1px; background:linear-gradient(90deg,var(--pink),transparent 70%); margin:10px 0 18px; }

/* Cover */
.cover{ display:flex; flex-direction:column; justify-content:space-between; }
.cover-top .brand{ font-family:var(--sans); font-weight:900; font-size:15px; letter-spacing:0.02em; }
.cover-mid{ margin-top:30px; }
.cover-title{ font-size:54px; font-weight:800; letter-spacing:-0.03em; line-height:0.98; }
.cover-title .serif{ font-size:54px; color:var(--pink); display:block; }
.cover-sub{ max-width:520px; margin-top:18px; font-size:13px; color:var(--muted-fg); }
.stat-row{ display:flex; gap:14px; margin-top:36px; }
.stat{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 20px; min-width:130px; box-shadow:0 10px 30px -10px rgba(26,26,26,.08); }
.stat .num{ font-size:26px; font-weight:800; color:var(--pink); font-family:var(--sans); }
.stat .lbl{ font-size:9.5px; color:var(--muted-fg); margin-top:4px; text-transform:uppercase; letter-spacing:0.06em; font-family:var(--mono);}
.cover-bottom{ display:flex; justify-content:space-between; align-items:flex-end; font-family:var(--mono); font-size:9.5px; color:var(--muted-fg); border-top:1px solid var(--border); padding-top:12px; }

/* Section header */
.section-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; }
.section-head h2{ font-size:30px; font-weight:800; }
.section-num{ font-family:var(--mono); font-size:11px; color:var(--muted-fg); }
.section-blurb{ max-width:680px; font-size:11px; color:var(--muted-fg); margin-bottom:14px; }

/* Legend */
.legend{ display:flex; gap:16px; margin:6px 0 14px; }
.legend span{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.05em; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

/* Chart */
.chart-wrap{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 18px; margin-bottom:14px; box-shadow:0 10px 30px -10px rgba(26,26,26,.06);}
.chart-wrap .cap{ font-family:var(--mono); font-size:9px; color:var(--muted-fg); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;}

/* Table */
table{ width:100%; border-collapse:collapse; font-size:10px; }
thead{ display:table-header-group; }
tr{ break-inside:avoid; }
th{ text-align:left; font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted-fg); background:var(--muted); padding:7px 8px; border-bottom:1px solid var(--border); }
td{ padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:nth-child(even){ background:rgba(240,234,224,0.4); }
.cat-name{ font-weight:700; }
.ind{ color:var(--muted-fg); font-size:9.5px; }
.badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-family:var(--mono); font-size:8px; text-transform:uppercase; letter-spacing:0.04em; color:#fff; }
.price{ font-family:var(--mono); font-weight:700; white-space:nowrap; }
.blank{ display:inline-block; min-width:64px; border:1px dashed var(--pink); border-radius:8px; color:var(--pink); font-family:var(--mono); font-size:8.5px; text-align:center; padding:3px 6px; opacity:0.65; }
.group-title{ font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--pink); margin:16px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--border);}
.group-title:first-of-type{ margin-top:4px; }

/* Maintenance cards */
.maint-grid{ display:flex; gap:14px; margin-top:10px; }
.maint-card{ flex:1; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; position:relative; box-shadow:0 10px 30px -10px rgba(26,26,26,.08); }
.maint-card.popular{ background:var(--teal); color:#fff; border-color:transparent; }
.maint-card .tag{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:var(--pink); color:#fff; font-family:var(--mono); font-size:8px; text-transform:uppercase; letter-spacing:0.08em; padding:3px 10px; border-radius:20px; }
.maint-card h3{ font-size:17px; }
.maint-row{ display:flex; justify-content:space-between; align-items:baseline; margin:12px 0; font-family:var(--mono); }
.maint-row .lbl{ font-size:8.5px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.7;}
.maint-row .val{ font-size:13px; font-weight:700; }
.maint-card ul{ list-style:none; margin-top:10px; padding:0; }
.maint-card li{ font-size:9.5px; padding:3px 0; display:flex; gap:6px; }
.maint-card li::before{ content:"+"; color:var(--pink); font-weight:800; }
.maint-card.popular li::before{ color:#fff; }

/* Addon grid */
.addon-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.addon{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:9px 12px; display:flex; justify-content:space-between; align-items:center; }
.addon .name{ font-size:10px; font-weight:600; }

/* footer */
.foot{ position:absolute; bottom:8mm; left:14mm; right:14mm; display:flex; justify-content:space-between; font-family:var(--mono); font-size:8px; color:var(--muted-fg); border-top:1px solid var(--border); padding-top:6px; }
</style>

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

/* Maintenance is derived per category from its own Market Price (industry baseline:
   15-25% of build cost / yr), not a flat tier price — so it stays accurate if a
   category's market price above is ever revised. */
function parsePriceRange(str){
  const m = str.match(/₹([\d.]+)L[–-]₹([\d.]+)L/);
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0,0];
}
function fmtL(n){
  return (Math.round(n*100)/100).toString();
}

  const [min,max] = parsePriceRange(priceStr);
  return `₹${fmtL(min*0.15)}L–₹${fmtL(max*0.25)}L`;
}

function scatterSVG(rows, caption){
  const W=900,H=220,padL=50,padB=30,padT=14,padR=14;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const maxWk = Math.max(...rows.map(r=>r[5])) + 4;
  const tierX = {B:0.14,M:0.38,H:0.62,E:0.86};
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  // gridlines
  for(let i=0;i<=4;i++){
    const y = padT + innerH - (innerH*i/4);
    const val = Math.round(maxWk*i/4);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E5DDD3" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" font-size="9" font-family="JetBrains Mono" fill="#544E45" text-anchor="end">${val}w</text>`;
  }
  Object.entries(tierX).forEach(([code,fx])=>{
    const x = padL + innerW*fx;
    svg += `<text x="${x}" y="${H-8}" font-size="9" font-family="JetBrains Mono" fill="#544E45" text-anchor="middle">${T[code].l}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+innerH}" stroke="#1A1A1A" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#1A1A1A" stroke-width="1"/>`;
  rows.forEach((r,i)=>{
    const code=r[2], avgWk=(r[4]+r[5])/2;
    const jitter = ((i%7)-3)*0.025;
    const x = padL + innerW*(tierX[code]+jitter);
    const y = padT + innerH - (innerH*avgWk/maxWk);
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${T[code].c}" opacity="0.85"/>`;
  });
  svg += `</svg>`;
  return `<div class="chart-wrap"><div class="cap">${caption}</div>${svg}</div>`;
}

function legendHTML(){
  return `<div class="legend">` + Object.entries(T).map(([k,v])=>`<span><span class="dot" style="background:${v.c}"></span>${v.l}</span>`).join("") + `</div>`;
}
